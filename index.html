<style>/* Layout concept: presentation shell (tabs: Design System / Resident / Provider / Admin) around device frames; all UI built from logical properties so RTL/LTR mirror automatically. */
:root{
--navy-900:#0A1B3D;--p-700:#123A7A;--p-600:#1A4FA3;--p-500:#2A66C9;--p-100:#E3ECFB;--p-50:#F1F5FD;

--bg:#F7F8FA;--surface:#FFFFFF;--elev:#FFFFFF;--sunken:#EEF1F5;--border:#E6E9EF;--border-strong:#D3D9E3;
--text:#0B1220;--muted:#5B6577;--faint:#8A94A6;
--primary:#1A4FA3;--primary-hover:#123A7A;--on-primary:#fff;--primary-soft:#E3ECFB;--primary-text:#1A4FA3;
--accent:#12915A;--accent-text:#0B7A4B;--accent-soft:#DCF2E7;

--ring:rgba(42,102,201,.35);--overlay:rgba(10,27,61,.45);
--shadow-1:0 1px 2px rgba(10,27,61,.06),0 1px 1px rgba(10,27,61,.04);
--shadow-2:0 4px 12px rgba(10,27,61,.07),0 1px 3px rgba(10,27,61,.05);
--shadow-3:0 12px 28px rgba(10,27,61,.12),0 3px 8px rgba(10,27,61,.06);
--shadow-4:0 28px 60px rgba(10,27,61,.22),0 8px 20px rgba(10,27,61,.1);
--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;--r-2xl:28px;--r-pill:999px;
--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s7:32px;--s8:40px;--s9:48px;--s10:64px;
--ease:cubic-bezier(.2,.8,.2,1);--t1:120ms;--t2:200ms;--t3:320ms;
--font-display:'Readex Pro','IBM Plex Sans Arabic','Inter',system-ui,sans-serif;

--shell-bg:#E9EDF3;--shell-bar:#FFFFFF;--hero-grad:linear-gradient(135deg,#0A1B3D 0%,#123A7A 60%,#1A4FA3 100%);
--c-elec:#D98A0B;--c-plumb:#2A7DE1;--c-ac:#0EA5C6;--c-clean:#12A06A;--c-laundry:#8B5CF6;--c-garden:#65A30D;--c-pest:#E0527A;--c-move:#C2641E;--c-appl:#4F6BED;--c-car:#F26B21;--c-pool:#14B8A6;--c-sec:#64748B;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#0A0F1C;--surface:#121A2B;--elev:#182238;--sunken:#0E1525;--border:#25304A;--border-strong:#33405F;--text:#EEF2FA;--muted:#9AA6BD;--faint:#6F7B94;
--primary:#5B93F0;--primary-hover:#7BA9F5;--on-primary:#0A1B3D;--primary-soft:#172A4D;--primary-text:#8DB4F7;--accent:#3DD08E;--accent-text:#4FDB9B;--accent-soft:#103426;
--gold:#D9B877;--gold-text:#E2C690;--gold-soft:#2C2416;--success:#3DD08E;--success-bg:#103426;--warn:#F0B34A;--warn-bg:#352711;--warn-text:#F3C877;--danger:#F26B6B;--danger-bg:#3A1717;--danger-text:#F59A9A;--info:#7BA9F5;--info-bg:#172A4D;
--ring:rgba(123,169,245,.45);--overlay:rgba(0,0,0,.6);--shadow-1:0 1px 2px rgba(0,0,0,.4);--shadow-2:0 4px 12px rgba(0,0,0,.35);--shadow-3:0 12px 28px rgba(0,0,0,.45);--shadow-4:0 28px 60px rgba(0,0,0,.6);
--shell-bg:#05080F;--shell-bar:#0C1322;--hero-grad:linear-gradient(135deg,#0B1A38 0%,#13306B 60%,#1B4290 100%);color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#0A0F1C;--surface:#121A2B;--elev:#182238;--sunken:#0E1525;--border:#25304A;--border-strong:#33405F;--text:#EEF2FA;--muted:#9AA6BD;--faint:#6F7B94;
--primary:#5B93F0;--primary-hover:#7BA9F5;--on-primary:#0A1B3D;--primary-soft:#172A4D;--primary-text:#8DB4F7;--accent:#3DD08E;--accent-text:#4FDB9B;--accent-soft:#103426;
--gold:#D9B877;--gold-text:#E2C690;--gold-soft:#2C2416;--success:#3DD08E;--success-bg:#103426;--warn:#F0B34A;--warn-bg:#352711;--warn-text:#F3C877;--danger:#F26B6B;--danger-bg:#3A1717;--danger-text:#F59A9A;--info:#7BA9F5;--info-bg:#172A4D;
--ring:rgba(123,169,245,.45);--overlay:rgba(0,0,0,.6);--shadow-1:0 1px 2px rgba(0,0,0,.4);--shadow-2:0 4px 12px rgba(0,0,0,.35);--shadow-3:0 12px 28px rgba(0,0,0,.45);--shadow-4:0 28px 60px rgba(0,0,0,.6);
--shell-bg:#05080F;--shell-bar:#0C1322;--hero-grad:linear-gradient(135deg,#0B1A38 0%,#13306B 60%,#1B4290 100%);color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--shell-bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.5;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;font-weight:600;text-wrap:balance}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:var(--r-sm)}
.ic{width:22px;height:22px;flex:none;display:inline-block;vertical-align:middle;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.s16{width:16px;height:16px}.ic.s18{width:18px;height:18px}.ic.s20{width:20px;height:20px}.ic.s28{width:28px;height:28px}.ic.s32{width:32px;height:32px}.ic.s40{width:40px;height:40px}
[dir=rtl] .dir{transform:scaleX(-1)}
.num{font-variant-numeric:tabular-nums}

/* ===== Presentation shell ===== */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 0;background:var(--shell-bg)}
.brandbar{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700}
.brandbar small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--shell-bar);padding:4px;border-radius:var(--r-pill);box-shadow:var(--shadow-1);border:1px solid var(--border);flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:var(--r-pill);font-weight:500;color:var(--muted);display:flex;gap:6px;align-items:center;transition:all var(--t2) var(--ease)}
.tab:hover{color:var(--text)}.tab.on{background:var(--primary);color:var(--on-primary)}
.tools{margin-inline-start:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;background:var(--shell-bar);border:1px solid var(--border);border-radius:var(--r-pill);padding:3px}
.seg button{padding:6px 12px;border-radius:var(--r-pill);font-size:12.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:4px}
.seg button.on{background:var(--primary-soft);color:var(--primary-text)}
.stage{display:grid;grid-template-columns:230px minmax(0,1fr) 300px;gap:24px;align-items:start;padding-block:12px 48px}
.side-index{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto;background:var(--shell-bar);border:1px solid var(--border);border-radius:var(--r-xl);padding:10px}
.side-index h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:8px 10px 4px;font-family:var(--font-body)}
.idx{display:flex;width:100%;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r-md);color:var(--muted);font-size:13px;text-align:start}
.idx:hover{background:var(--sunken);color:var(--text)}.idx.on{background:var(--primary-soft);color:var(--primary-text);font-weight:600}
.idx i{font-style:normal;font-size:11px;width:20px;color:var(--faint)}
.notes{position:sticky;top:76px;background:var(--shell-bar);border:1px solid var(--border);border-radius:var(--r-xl);padding:18px;max-height:calc(100vh - 96px);overflow:auto}
.notes h3{font-size:16px;margin-bottom:4px}.notes .tag{font-size:11px;color:var(--accent-text);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.notes p{color:var(--muted);margin:8px 0;font-size:13px}.notes b{color:var(--text)}
.notes ul{margin:6px 0;padding-inline-start:18px;color:var(--muted);font-size:13px}
.notes .why{background:var(--gold-soft);border-radius:var(--r-md);padding:10px 12px;color:var(--text);font-size:13px;margin-top:10px}
.notes .why span{display:block;font-size:11px;font-weight:700;color:var(--gold-text);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.devwrap{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.devbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.phone-wrap{display:flex;justify-content:center;width:100%}
.device{flex:none;position:relative;transform-origin:top center;background:var(--bg);color:var(--text);overflow:hidden;container-type:inline-size;container-name:dev}
.device.phone{width:390px;height:844px;border-radius:54px;border:11px solid #0B1020;box-shadow:var(--shadow-4),0 0 0 2px #2a3350}
.device.tablet{width:820px;height:1060px;border-radius:32px;border:12px solid #0B1020;box-shadow:var(--shadow-4)}
.device.desktop{width:1280px;height:780px;border-radius:14px;border:1px solid var(--border-strong);box-shadow:var(--shadow-4)}
.island{position:absolute;top:10px;inset-inline:0;margin-inline:auto;width:110px;height:30px;border-radius:20px;background:#05070d;z-index:60}
.device.tablet .island,.device.desktop .island{display:none}
.browserbar{display:none;height:38px;background:var(--sunken);border-bottom:1px solid var(--border);align-items:center;padding-inline:14px;gap:8px}
.device.desktop .browserbar{display:flex}
.browserbar i{width:11px;height:11px;border-radius:50%;background:#FF6058}.browserbar i:nth-child(2){background:#FFBD2E}.browserbar i:nth-child(3){background:#27C93F}
.browserbar span{margin-inline:auto;background:var(--surface);border-radius:8px;padding:3px 40px;font-size:12px;color:var(--muted)}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.device.desktop .scr{top:38px}
.sb{height:48px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-weight:600;font-size:14px;font-family:var(--font-display);z-index:5}
.device.tablet .sb{height:30px;align-items:center;padding-bottom:0}.device.desktop .sb{display:none}
.sb .r{display:flex;gap:5px;align-items:center}
.body{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.body::-webkit-scrollbar{display:none}
.anim{animation:enter var(--t3) var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stg>*{animation:enter var(--t3) var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
.tabbar{flex:none;display:flex;padding:8px 10px 22px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--border);z-index:5}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);font-size:10.5px;padding:6px 0;font-weight:500;position:relative;transition:color var(--t2)}
.tb.on{color:var(--primary-text)}.tb.on .ic{stroke-width:2.2}
.tb.on::before{content:"";position:absolute;top:-9px;width:24px;height:3px;border-radius:3px;background:var(--primary)}
.tb:active .ic{transform:scale(.88)}.tb .ic{transition:transform var(--t1)}
.device.desktop .tabbar,.device.tablet .tabbar{order:-1;border-top:0;border-bottom:1px solid var(--border);padding:8px 24px;justify-content:center;gap:8px}
.device.desktop .tb,.device.tablet .tb{flex:none;flex-direction:row;gap:8px;padding:8px 16px;font-size:13px;border-radius:var(--r-pill)}
.device.desktop .tb.on::before,.device.tablet .tb.on::before{display:none}
.device.desktop .tb.on,.device.tablet .tb.on{background:var(--primary-soft)}
.device.desktop .body>.pg,.device.tablet .body>.pg{max-width:1040px;margin-inline:auto}
.homeind{position:absolute;bottom:7px;inset-inline:0;margin-inline:auto;width:130px;height:5px;border-radius:5px;background:var(--text);opacity:.85;z-index:70;pointer-events:none}
.device.tablet .homeind,.device.desktop .homeind{display:none}

/* ===== App primitives ===== */
.pg{padding:8px 20px 28px}
.hdr{display:flex;align-items:center;gap:12px;padding:6px 16px 10px;flex:none}
.hdr h2{font-size:18px;flex:1;text-align:center}
.hdr.start h2{text-align:start}
.ib{width:44px;height:44px;border-radius:var(--r-pill);display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-1);flex:none;position:relative;transition:transform var(--t1)}
.ib:active{transform:scale(.92)}.ib.flat{border:0;background:transparent;box-shadow:none}
.ib .dot{position:absolute;top:10px;inset-inline-end:11px;width:9px;height:9px;border-radius:50%;background:var(--danger);border:2px solid var(--surface)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding-inline:22px;border-radius:var(--r-lg);font-weight:600;font-family:var(--font-display);font-size:15px;transition:transform var(--t1) var(--ease),background var(--t2),box-shadow var(--t2);white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--primary);color:var(--on-primary);box-shadow:0 6px 16px color-mix(in srgb,var(--primary) 30%,transparent)}
.btn.p:hover{background:var(--primary-hover)}
.btn.s{background:var(--primary-soft);color:var(--primary-text)}
.btn.o{border:1.5px solid var(--border-strong);background:var(--surface)}
.btn.g{color:var(--primary-text)}
.btn.ok{background:var(--accent);color:#fff}.btn.dg{background:var(--danger);color:#fff}.btn.dgs{background:var(--danger-bg);color:var(--danger-text)}
.btn.gold{background:linear-gradient(135deg,#C9A45C,#A98343);color:#1d1406}
.btn.md{height:44px;padding-inline:18px;font-size:14px;border-radius:var(--r-md)}.btn.sm{height:36px;padding-inline:14px;font-size:13px;border-radius:var(--r-md)}
.btn.blk{width:100%}.btn[disabled]{opacity:.45;pointer-events:none}
.btn.load{pointer-events:none;opacity:.9}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-top-color:transparent;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-1)}
.card.pad{padding:16px}.press{transition:transform var(--t1) var(--ease),box-shadow var(--t2)}.press:active{transform:scale(.985)}
.row{display:flex;align-items:center;gap:12px}.col{display:flex;flex-direction:column}.gap4{gap:4px}.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}
.grow{flex:1;min-width:0}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.muted{color:var(--muted)}.faint{color:var(--faint)}.sm{font-size:12.5px}.xs{font-size:11.5px}.b{font-weight:600}
.h1{font-size:28px;font-weight:700;line-height:1.25}.h2{font-size:20px;font-weight:600}.h3{font-size:16px;font-weight:600}
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}.sec h3{font-size:16px}.sec a{color:var(--primary-text);font-size:13px;font-weight:600;cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding-inline:10px;border-radius:var(--r-pill);font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.i{background:var(--info-bg);color:var(--primary-text)}.pill.s{background:var(--success-bg);color:var(--accent-text)}.pill.w{background:var(--warn-bg);color:var(--warn-text)}.pill.d{background:var(--danger-bg);color:var(--danger-text)}.pill.n{background:var(--sunken);color:var(--muted)}.pill.g{background:var(--gold-soft);color:var(--gold-text)}
.chip{height:38px;padding-inline:16px;border-radius:var(--r-pill);border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted);flex:none;transition:all var(--t2) var(--ease)}
.chip.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.hs{display:flex;gap:10px;overflow-x:auto;padding-block:2px;margin-inline:-20px;padding-inline:20px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600}
.inp{height:52px;border-radius:var(--r-md);border:1.5px solid var(--border-strong);background:var(--surface);padding-inline:14px;display:flex;align-items:center;gap:8px;transition:border-color var(--t2),box-shadow var(--t2)}
.inp:focus-within{border-color:var(--primary);box-shadow:0 0 0 4px var(--ring)}
.inp input,.inp select{flex:1;min-width:0;border:0;background:transparent;outline:0;height:100%;font-size:15px}
.inp.err{border-color:var(--danger)}.errtxt{color:var(--danger-text);font-size:12px;display:flex;gap:4px;align-items:center}
.inp .pre{color:var(--muted);border-inline-end:1px solid var(--border);padding-inline-end:10px;font-weight:600}
textarea.ta{width:100%;min-height:92px;border-radius:var(--r-md);border:1.5px solid var(--border-strong);background:var(--surface);padding:12px 14px;resize:none;outline:0}
textarea.ta:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--ring)}
.shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.sw{width:50px;height:30px;border-radius:30px;background:var(--border-strong);position:relative;transition:background var(--t2);flex:none}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:var(--shadow-2);transition:transform var(--t2) var(--ease)}
.sw.on{background:var(--accent)}.sw.on::after{transform:translateX(20px)}[dir=rtl] .sw.on::after{transform:translateX(-20px)}
.list{overflow:hidden;padding:0}
.li{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);width:100%;text-align:start}
.li:last-child{border:0}.li:active{background:var(--sunken)}
.li .lic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary-text);flex:none}
.cat{--c:var(--primary);width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:500;text-align:center;line-height:1.3}
.cat .ci{width:60px;height:60px;border-radius:20px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 18%,transparent);transition:transform var(--t2) var(--ease)}
.cat:active .ci{transform:scale(.92)}
.cat .ci .ic{width:28px;height:28px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px}
@container dev (min-width:700px){.tiles{grid-template-columns:repeat(6,1fr)}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.auto3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}}
.promo{border-radius:var(--r-xl);padding:18px;background:var(--hero-grad);color:#fff;position:relative;overflow:hidden;min-height:132px}
.promo::after{content:"";position:absolute;inset-inline-end:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(201,164,92,.55),transparent 70%)}

 const route='M40 230 C 90 230 90 170 150 170 S 210 120 250 120 S 290 70 290 50';
 const bl=(x,y,w,h,l,c='var(--p-600)')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${c}" opacity=".16" stroke="${c}" stroke-opacity=".35"/><text x="${x+w/2}" y="${y+h/2+4}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="var(--font-body)">${l}</text>`;
 return `<div class="map"><svg viewBox="0 0 340 280" role="img" aria-label="${T('خريطة الكومباوند','Compound map')}"><rect width="340" height="280" fill="var(--sunken)"/><path d="M0 200h340M120 0v280M230 0v280M0 90h340" stroke="var(--surface)" stroke-width="12"/><ellipse cx="60" cy="130" rx="38" ry="26" fill="#14B8A6" opacity=".22"/><text x="60" y="134" text-anchor="middle" font-size="10" fill="var(--muted)">${T('المسبح','Pool')}</text>${bl(140,20,70,56,T('عمارة 11','Bldg 11'))}${bl(250,20,70,56,T('عمارة 12','Bldg 12'),'var(--e-600)')}${bl(140,106,70,76,T('النادي','Clubhouse'),'var(--c-elec)')}${bl(250,106,70,76,T('عمارة 13','Bldg 13'))}${bl(20,20,80,56,T('حدائق','Gardens'),'var(--c-garden)')}${bl(140,216,70,50,T('جراج','Garage'),'var(--c-sec)')}${bl(250,216,70,50,T('فيلات','Villas'))}<path d="${route}" stroke="var(--p-600)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${mode==='arrived'?'0':'1 9'}" fill="none"/><g><circle cx="40" cy="230" r="9" fill="var(--e-600)"/><circle cx="40" cy="230" r="3.5" fill="#fff"/><text x="40" y="254" text-anchor="middle" font-size="9.5" fill="var(--text)" font-weight="600">${T('البوابة 2','Gate 2')}</text></g><g transform="translate(290 50)"><path d="M0-30c-11 0-19 8-19 19 0 15 19 31 19 31s19-16 19-31c0-11-8-19-19-19z" fill="var(--navy-900)"/><circle cy="-11" r="7" fill="#E2C690"/></g>${mode==='arrived'?`<g transform="translate(290 50)"><circle r="14" fill="var(--accent)" opacity=".25"/></g>`:`<g><circle r="14" fill="var(--primary)" opacity=".2"><animateMotion dur="9s" repeatCount="indefinite" path="${route}"/></circle><circle r="8" fill="var(--primary)" stroke="#fff" stroke-width="2.5"><animateMotion dur="9s" repeatCount="indefinite" path="${route}"/></circle></g>`}</svg></div>`;
}

/* ===== Router / rendering ===== */
const APPS={resident:{key:'rs',stack:'rstack',pk:'rp'},provider:{key:'ps',stack:'pstack',pk:'pp'}};
const SCR={resident:{},provider:{}};
function go(id,p={},opt={}){const a=S.tab==='provider'?'provider':'resident',A=APPS[a];
 if(opt.root){S[A.stack]=[]}else if(!opt.replace){S[A.stack].push([S[A.key],S[A.pk]])}
 S[A.key]=id;S[A.pk]=p;S.ov=null;S.toast=null;
 const sc=SCR[a][id];
 if(sc&&sc.skel&&!S.seen[a+id]){S.seen[a+id]=1;S.loading=true;setTimeout(()=>{S.loading=false;render()},700)}
 render(true)}
function back(){const a=S.tab==='provider'?'provider':'resident',A=APPS[a];const prev=S[A.stack].pop();
 if(prev){S[A.key]=prev[0];S[A.pk]=prev[1]}S.ov=null;render(true)}
function toast(msg,ic='circle-check'){S.toast={msg,ic};render();clearTimeout(toast.t);toast.t=setTimeout(()=>{S.toast=null;render()},2400)}
function sheet(html){S.ov={t:'sheet',html};render()}
function dialog(html){S.ov={t:'dlg',html};render()}
function closeOv(){S.ov=null;render()}
const ACT={};
document.addEventListener('click',e=>{const el=e.target.closest('[data-go],[data-a],[data-back]');if(!el)return;
 if(el.dataset.back!==undefined){back();return}
 if(el.dataset.go){go(el.dataset.go,el.dataset.p?JSON.parse(el.dataset.p):{},{root:el.dataset.root!==undefined});return}
 const f=ACT[el.dataset.a];if(f){f(el,el.dataset.v)}});
const P=o=>esc(JSON.stringify(o));
const NARROW=()=>window.matchMedia('(max-width:640px)').matches;
function setScale(){const dv=$('.device'),w=$('.phone-wrap');
 if(NARROW()){if(dv){dv.style.transform='none'}if(w)w.style.height='auto';document.documentElement.style.setProperty('--ps',1);return}
 const vw=document.documentElement.clientWidth-32,vh=window.innerHeight-130;const dims={phone:[412,866],tablet:[844,1084],desktop:[1280,780]}[S.device];
 const avail=S.tab==='resident'||S.tab==='provider'?(window.innerWidth>1180?vw-230-300-48:vw):vw;
 const ps=Math.max(.3,Math.min(1,avail/dims[0],S.device==='desktop'?1:vh/dims[1]));
 document.documentElement.style.setProperty('--ps',ps);if(dv){dv.style.transform=`scale(${ps})`;w.style.height=dims[1]*ps+'px'}}
let wasNarrow=null;
window.addEventListener('resize',()=>{const n=NARROW();if(wasNarrow!==null&&n!==wasNarrow&&typeof render==='function'){wasNarrow=n;render(true)}else{wasNarrow=n;setScale()}});

const lum=h=>{const c=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const cr=(a,b)=>{const x=lum(a),y=lum(b),r=(Math.max(x,y)+.05)/(Math.min(x,y)+.05);return r.toFixed(1)};

const RIDX=['splash','onboard','login','otp','home','search','categories','service','booking','calendar','upload','success','track','notif','fav','wallet','history','reviews','rate','profile','settings','lang','help','about'];
const PIDX=['dash','jobs','job','customer','nav','status','invoice','earn','avail','pprofile'];
const RTABS=[['home','house','الرئيسية','Home','home'],['cat','layout-grid','الخدمات','Services','categories'],['orders','clipboard-list','طلباتي','Orders','history'],['fav','heart','المفضلة','Favorites','fav'],['profile','user','حسابي','Account','profile']];
const PTABS=[['dash','layout-dashboard','الرئيسية','Home','dash'],['jobs','briefcase','المهام','Jobs','jobs'],['earn','wallet','الأرباح','Earnings','earn'],['pp','user','حسابي','Profile','pprofile']];
function setLang(l){S.lang=l;document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';render()}
function setTheme(t){S.theme=t;if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=t;render()}
const isDark=()=>document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);
ACT.tab=(e,v)=>{S.tab=v;S.ov=null;S.toast=null;if(v!=='resident')S.device='phone';location.hash=v==='ds'?'design-system':v;render(true)};
ACT.jump=(e,v)=>{const a=S.tab==='provider'?'provider':'resident',A=APPS[a];S[A.stack]=[];S[A.key]=v;S[A.pk]={};S.ov=null;S.toast=null;S.sim='normal';
 if(v==='booking'){S.bk.step=0}if(v==='track')S.stage=2;if(v==='success')S.stage=0;if(v==='service')S[A.pk]={id:'elec1'};if(v==='reviews')S[A.pk]={id:'clean1'};
 const sc=SCR[a][v];if(sc&&sc.skel){S.loading=true;setTimeout(()=>{S.loading=false;render()},650)}render(true)};
ACT.dev=(e,v)=>{S.device=v;render()};ACT.sim=(e,v)=>{S.sim=v;render()};ACT.lang=(e,v)=>setLang(v);ACT.th=(e,v)=>setTheme(v);ACT.notes=()=>{S.notes=!S.notes;render()};
ACT.dsgo=(e,v)=>{const el=document.getElementById('ds-'+v);el&&el.scrollIntoView({behavior:'smooth',block:'start'})};
const SIGNAL=`<svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>`;
const BATT=`<svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3.5" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="17" height="8" rx="2" fill="currentColor"/><rect x="24" y="4" width="2" height="4" rx="1" fill="currentColor" opacity=".5"/></svg>`;
function deviceHTML(app){const A=APPS[app],id=S[A.key],sc=SCR[app][id]||SCR[app][Object.keys(SCR[app])[0]],inner=sc.r(S[A.pk]||{}),tabs=app==='resident'?RTABS:PTABS;
 const tb=sc.tab?`<nav class="tabbar" aria-label="main">${tabs.map(t=>`<button class="tb ${sc.tab===t[0]?'on':''}" data-go="${t[4]}" data-root>${I(t[1])}<span>${T(t[2],t[3])}</span></button>`).join('')}</nav>`:'';
 return `<div class="device ${S.device}" dir="${S.lang==='ar'?'rtl':'ltr'}"><div class="island"></div><div class="browserbar"><i></i><i></i><i></i><span dir="ltr">khadamati.jasminehills.app</span></div><div class="scr"><div class="sb" style="${sc.dark?'color:#fff':''}"><span class="num">9:41</span><span class="r">${SIGNAL}${I('wifi','s16')}${BATT}</span></div>${inner}${tb}</div>${S.ov?`<div class="ov ${S.ov.t==='dlg'?'c':''}" ${S.ov.t==='dlg'?'':'data-a="close"'}><div class="${S.ov.t==='dlg'?'dlg':'sheet'}" onclick="event.stopPropagation()">${S.ov.html}</div></div>`:''}${S.toast?`<div class="toast">${I(S.toast.ic)}<span>${S.toast.msg}</span></div>`:''}<div class="homeind"></div></div>`}
let lastKey='';
function render(nav){if(NARROW()&&S.device!=='phone')S.device='phone';const scr=$('.body'),ac=$('#acont'),ws=window.scrollY,key=S.tab+S.rs+S.ps+S.as+S.device;const sTop=scr?scr.scrollTop:0,aTop=ac?ac.scrollTop:0;
 const L=S.lang,tabs=[['ds','palette','نظام التصميم','Design system'],['resident','smartphone','تطبيق السكان','Resident app'],['provider','hard-hat','تطبيق الفني','Provider app'],['admin','layout-dashboard','لوحة الإدارة','Admin']];
 const top=`<header class="topbar"><div class="brandbar">${logoMark(38)}<div>${NARROW()?T('خدماتي','Khadamati'):T('خدماتي · ياسمين هيلز','Khadamati · Jasmine Hills')}<small>${T('نموذج تفاعلي · الإصدار 1.0','Interactive prototype · v1.0')}</small></div></div><nav class="tabs" aria-label="sections">${tabs.map(t=>`<button class="tab ${S.tab===t[0]?'on':''}" data-a="tab" data-v="${t[0]}">${I(t[1],'s18')}<span>${T(t[2],t[3])}</span></button>`).join('')}</nav><div class="tools"><div class="seg" role="group" aria-label="language"><button class="${L==='ar'?'on':''}" data-a="lang" data-v="ar">العربية</button><button class="${L==='en'?'on':''}" data-a="lang" data-v="en">EN</button></div><div class="seg" role="group" aria-label="theme"><button class="${!isDark()?'on':''}" data-a="th" data-v="light" aria-label="light">${I('sun','s16')}</button><button class="${isDark()?'on':''}" data-a="th" data-v="dark" aria-label="dark">${I('moon','s16')}</button></div></div></header>`;
 let main='';
 if(S.tab==='ds'){main=`<div class="stage" style="grid-template-columns:minmax(0,1fr)"><div>${dsHTML()}</div></div>`}
 else if(S.tab==='admin'){main=`<div class="stage" style="grid-template-columns:minmax(0,1fr)"><div><div class="devbar" style="justify-content:flex-start;margin-bottom:10px"><div class="seg">${[['normal','عادي','Normal'],['loading','تحميل','Loading'],['empty','فارغ','Empty'],['error','خطأ','Error']].map(x=>`<button class="${S.sim===x[0]?'on':''}" data-a="sim" data-v="${x[0]}">${T(x[1],x[2])}</button>`).join('')}</div><span class="xs muted">${T('حالة جدول الطلبات','Orders table state')}</span></div>${adminHTML()}</div></div>`}
 else{const app=S.tab,idx=app==='resident'?RIDX:PIDX,A=APPS[app],cur=S[A.key],sc=SCR[app][cur]||{},note=sc.note;
  const index=`<aside class="side-index" aria-label="screens"><h4>${app==='resident'?T('تطبيق السكان','Resident app'):T('تطبيق الفني','Provider app')} · ${idx.length}</h4>${idx.map((id,i)=>`<button class="idx ${cur===id?'on':''}" data-a="jump" data-v="${id}"><i class="num">${String(i+1).padStart(2,'0')}</i>${T(...SCR[app][id].n)}</button>`).join('')}</aside>`;
  const notes=S.notes&&note?`<aside class="notes"><div class="tag">${T('شرح الشاشة','Screen notes')}</div><h3>${T(...sc.n)}</h3><p>${T(note[0],note[1])}</p><div class="why"><span>${T('قرار التصميم','UX decision')}</span>${T(note[2],note[3])}</div><p class="xs faint" style="margin-top:14px">${T('الشرح الكامل لكل الشاشات والحالات متاح في وثيقة المقترح.','Full per-screen specs and states are in the proposal document.')}</p></aside>`:'<aside></aside>';
  main=`<div class="stage">${index}<div class="devwrap"><div class="devbar">${app==='resident'&&!NARROW()?`<div class="seg">${[['phone','smartphone','موبايل','Mobile'],['tablet','layout-grid','تابلت','Tablet'],['desktop','monitor','ويب','Web']].map(d=>`<button class="${S.device===d[0]?'on':''}" data-a="dev" data-v="${d[0]}">${I(d[1],'s16')}${T(d[2],d[3])}</button>`).join('')}</div>`:''}<div class="seg" title="${T('حالة الشاشة','Screen state')}">${[['normal','عادي','Normal'],['loading','تحميل','Loading'],['empty','فارغ','Empty'],['error','خطأ','Error']].map(x=>`<button class="${S.sim===x[0]?'on':''}" data-a="sim" data-v="${x[0]}">${T(x[1],x[2])}</button>`).join('')}</div><button class="seg" style="padding:3px" data-a="notes"><span class="${S.notes?'':'on'}" style="padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:500;${S.notes?'color:var(--muted)':'background:var(--primary-soft);color:var(--primary-text)'}">${S.notes?T('إخفاء الشرح','Hide notes'):T('إظهار الشرح','Show notes')}</span></button></div><div class="phone-wrap">${deviceHTML(app)}</div></div>${notes}</div>`}
 document.getElementById('app').innerHTML=top+main;
 if(S.tab==='resident'||S.tab==='provider'){const a=S.tab,sc=SCR[a][S[APPS[a].key]];sc&&sc.after&&sc.after()}
 setScale();
 const same=key===lastKey&&!nav;lastKey=key;
 if(same){const b=$('.body');if(b)b.scrollTop=sTop;const c=$('#acont');if(c)c.scrollTop=aTop;window.scrollTo(0,ws)}else if(nav&&S.tab!==lastKey.split('')[0]){}
}
function fromHash(){const h=location.hash.slice(1);const m={'design-system':'ds',resident:'resident',provider:'provider',admin:'admin'};if(m[h])S.tab=m[h]}
window.addEventListener('hashchange',()=>{fromHash();render(true)});
fromHash();
if(!document.getElementById('app')){const d=document.createElement('div');d.id='app';document.body.appendChild(d)}
render(true);


</script>
